<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALIX License Manager</title>
    <!-- مكتبة Supabase للتفاعل مع قاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f3f4f6; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        .glass-card { 
            background: rgba(17, 24, 39, 0.7); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-container" class="glass-card p-8 rounded-2xl w-full max-w-md shadow-2xl">
        <h1 class="text-2xl font-bold text-center mb-6 text-cyan-400">MALIX MANAGER</h1>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-gray-400">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="admin@malix.com" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-400">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500">
            </div>
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg transition">تسجيل الدخول</button>
        </form>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="dashboard-container" class="hidden w-full max-w-6xl space-y-6">
        <header class="glass-card p-4 rounded-xl flex justify-between items-center">
            <h1 class="text-xl font-bold text-cyan-400">MALIX / License Manager</h1>
            <button id="logout-btn" class="bg-red-600/20 text-red-400 px-4 py-2 rounded-lg text-sm hover:bg-red-600/30">تسجيل الخروج</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- نموذج إنشاء كود جديد -->
            <div class="glass-card p-6 rounded-xl space-y-4 md:col-span-1">
                <h2 class="text-lg font-semibold text-cyan-300">إنشاء كود تفعيل</h2>
                <form id="create-key-form" class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-400">مدة الصلاحية (بالأيام)</label>
                        <input type="number" id="duration" value="30" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">عدد الأجهزة المسموحة</label>
                        <input type="number" id="max-devices" value="1" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white">
                    </div>
                    <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 rounded text-sm transition">إنشاء الكود</button>
                </form>
            </div>

            <!-- عرض الأكواد -->
            <div class="glass-card p-6 rounded-xl space-y-4 md:col-span-2">
                <h2 class="text-lg font-semibold text-cyan-300">الأكواد النشطة</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead>
                            <tr class="border-b border-gray-800 text-gray-400">
                                <th class="p-2">الكود</th>
                                <th class="p-2">الصلاحية</th>
                                <th class="p-2">الأجهزة</th>
                                <th class="p-2">الحالة</th>
                            </tr>
                        </thead>
                        <tbody id="keys-table-body">
                            <!-- تعبئة البيانات أوتوماتيكياً -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات الربط الخاصة بمشروعك
        const SUPABASE_URL = 'https://wm4nSOOAY-RXR2fEkMGlPw_MnHik0AH.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_wm4nSOOAY-RXR2fEkMGlPw_MnHik0AH';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginForm = document.getElementById('login-form');
        const logoutBtn = document.getElementById('logout-btn');
        const createKeyForm = document.getElementById('create-key-form');
        const keysTableBody = document.getElementById('keys-table-body');

        // التحقق من حالة الدخول
        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                loadKeys();
            } else {
                authContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
            }
        }

        // تسجيل الدخول
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('خطأ في البيانات: ' + error.message);
            } else {
                checkUser();
            }
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            checkUser();
        });

        // جلب الأكواد من Supabase
        async function loadKeys() {
            keysTableBody.innerHTML = '';
            const { data, error } = await supabaseClient.from('license_keys').select('*').order('created_at', { ascending: false });
            
            if (data) {
                data.forEach(k => {
                    keysTableBody.innerHTML += `
                        <tr class="border-b border-gray-800/50">
                            <td class="p-2 font-mono text-cyan-400 select-all">${k.key_code}</td>
                            <td class="p-2">${k.duration_days} يوم</td>
                            <td class="p-2">${k.used_devices}/${k.max_devices}</td>
                            <td class="p-2">
                                <span class="px-2 py-1 rounded text-xs ${k.is_active ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                                    ${k.is_active ? 'نشط' : 'معطل'}
                                </span>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        // إنشاء كود جديد
        createKeyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const duration = document.getElementById('duration').value;
            const maxDevices = document.getElementById('max-devices').value;
            const randomKey = 'MALIX-' + Math.random().toString(36).substring(2, 10).toUpperCase();
            
            const { data: { user } } = await supabaseClient.auth.getUser();

            const { error } = await supabaseClient.from('license_keys').insert([
                { key_code: randomKey, duration_days: parseInt(duration), max_devices: parseInt(maxDevices), created_by: user.id }
            ]);

            if (error) {
                alert('فشل إنشاء الكود: ' + error.message);
            } else {
                alert('تم إنشاء الكود: ' + randomKey);
                loadKeys();
            }
        });

        checkUser();
    </script>
</body>
</html>
