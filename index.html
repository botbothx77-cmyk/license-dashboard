<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة أكواد التفعيل</title>
    <!-- مكتبة Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .hidden { display: none !important; }
        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .login-card input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid var(--border-color); border-radius: 6px; }
        .login-card button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .logout-btn { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; }
        .btn-primary { background: var(--primary); color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .controls-bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
        .search-box { position: relative; flex: 1; min-width: 200px; }
        .search-box input { width: 100%; padding: 10px 35px 10px 10px; border: 1px solid var(--border-color); border-radius: 6px; }
        .search-box i { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
        .export-btns { display: flex; gap: 5px; }
        .btn-secondary { background: #6b7280; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 700px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background: #f9fafb; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-disabled { background: #fee2e2; color: #991b1b; }
        .badge-expired { background: #fef3c7; color: #92400e; }
        .action-btn { background: none; border: none; cursor: pointer; margin: 0 4px; font-size: 16px; }
        .btn-toggle { color: var(--warning); }
        .btn-delete { color: var(--danger); }
        .error-msg { color: var(--danger); font-size: 12px; margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginOverlay" class="overlay">
        <div class="login-card">
            <h2><i class="fa-solid fa-lock"></i> تسجيل الدخول</h2>
            <p>أدخل كلمة مرور لوحة التحكم للمتابعة</p>
            <input type="password" id="adminPassword" placeholder="كلمة المرور">
            <button onclick="checkAuth()"><i class="fa-solid fa-key"></i> دخول</button>
            <span id="loginError" class="error-msg"></span>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="mainDashboard" class="container hidden">
        <header>
            <div class="header-title">
                <h1><i class="fa-solid fa-shield-halved"></i> نظام إدارة أكواد التفعيل</h1>
                <p>توليد وتتبع الصلاحيات والأجهزة عبر Supabase</p>
            </div>
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </header>

        <!-- نموذج توليد الأكواد -->
        <section class="card">
            <h2><i class="fa-solid fa-plus-circle"></i> توليد أكواد جديدة</h2>
            <form id="generateForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>عدد الأكواد:</label>
                        <input type="number" id="codeCount" value="1" min="1" max="100" required>
                    </div>
                    <div class="form-group">
                        <label>نوع الصلاحية:</label>
                        <select id="durationType" onchange="toggleCustomDays()">
                            <option value="day">يوم واحد</option>
                            <option value="week">أسبوع</option>
                            <option value="month" selected>شهر</option>
                            <option value="year">سنة</option>
                            <option value="custom">مخصص (بالأيام)</option>
                        </select>
                    </div>
                    <div class="form-group hidden" id="customDaysGroup">
                        <label>عدد الأيام المخصصة:</label>
                        <input type="number" id="customDays" value="30" min="1">
                    </div>
                    <div class="form-group">
                        <label>الحد الأقصى للأجهزة:</label>
                        <input type="number" id="maxDevices" value="1" min="1" max="50" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary"><i class="fa-solid fa-wand-magic-sparkles"></i> إنشاء الأكواد الآن</button>
            </form>
        </section>

        <!-- أدوات البحث والتصفية والتصدير -->
        <section class="card">
            <div class="controls-bar">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="بحث بالكود..." oninput="filterCodes()">
                </div>
                <div class="filter-box">
                    <select id="statusFilter" onchange="filterCodes()">
                        <option value="all">كل الحالات</option>
                        <option value="active">مفعل</option>
                        <option value="disabled">معطل</option>
                        <option value="expired">منتهي الصلاحية</option>
                    </select>
                </div>
                <div class="export-btns">
                    <button class="btn-secondary" onclick="exportData('csv')"><i class="fa-solid fa-file-csv"></i> CSV</button>
                    <button class="btn-secondary" onclick="exportData('json')"><i class="fa-solid fa-file-code"></i> JSON</button>
                </div>
            </div>
        </section>

        <!-- جدول الأكواد -->
        <section class="card table-responsive">
            <h2><i class="fa-solid fa-list"></i> الأكواد التفعيلية</h2>
            <table>
                <thead>
                    <tr>
                        <th>الكود</th>
                        <th>الصلاحية</th>
                        <th>الأجهزة</th>
                        <th>الحالة</th>
                        <th>تاريخ الإنشاء</th>
                        <th>بداية التفعيل</th>
                        <th>تاريخ الانتهاء</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="codesTableBody">
                    <tr><td colspan="8" class="text-center">جاري تحميل البيانات...</td></tr>
                </tbody>
            </table>
        </section>
    </div>

    <script>
        // إعدادات Supabase (ضع معلومات مشروعك هنا)
        const SUPABASE_URL = "https://gylxvebughweeiahxcfx.supabase.co/rest/v1/"; 
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; 
        const ADMIN_PASSWORD_HASH = "sb_publishable_3_33YHMiF-hXWtFlf4mhWw_xY2qNKnl"; // كلمة مرور لوحة التحكم

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allCodes = [];

        document.addEventListener("DOMContentLoaded", () => {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                showDashboard();
            }
        });

        function checkAuth() {
            const inputPass = document.getElementById("adminPassword").value;
            if (inputPass === ADMIN_PASSWORD_HASH) {
                sessionStorage.setItem("isLoggedIn", "true");
                showDashboard();
            } else {
                document.getElementById("loginError").innerText = "كلمة المرور غير صحيحة!";
            }
        }

        function logout() {
            sessionStorage.removeItem("isLoggedIn");
            location.reload();
        }

        function showDashboard() {
            document.getElementById("loginOverlay").classList.add("hidden");
            document.getElementById("mainDashboard").classList.remove("hidden");
            loadCodes();
        }

        function toggleCustomDays() {
            const type = document.getElementById("durationType").value;
            const group = document.getElementById("customDaysGroup");
            if (type === "custom") {
                group.classList.remove("hidden");
            } else {
                group.classList.add("hidden");
            }
        }

        function generateCodeString() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 16; i++) {
                if (i > 0 && i % 4 === 0) result += '-';
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function getDaysFromType(type) {
            switch (type) {
                case 'day': return 1;
                case 'week': return 7;
                case 'month': return 30;
                case 'year': return 365;
                case 'custom': return parseInt(document.getElementById("customDays").value) || 30;
                default: return 30;
            }
        }

        document.getElementById("generateForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const count = parseInt(document.getElementById("codeCount").value);
            const durationType = document.getElementById("durationType").value;
            const durationDays = getDaysFromType(durationType);
            const maxDevices = parseInt(document.getElementById("maxDevices").value);

            const newCodes = [];
            for (let i = 0; i < count; i++) {
                newCodes.push({
                    code: generateCodeString(),
                    duration_type: durationType,
                    duration_days: durationDays,
                    max_devices: maxDevices,
                    status: 'active'
                });
            }

            const { error } = await supabaseClient.from('activation_codes').insert(newCodes);
            if (error) {
                alert("خطأ أثناء الحفظ: " + error.message);
            } else {
                alert(`تم إنشاء ${count} كود بنجاح!`);
                loadCodes();
            }
        });

        async function loadCodes() {
            const { data, error } = await supabaseClient
                .from('activation_codes')
                .select('*')
                .order('created_at', { ascending: false });

            if (!error) {
                allCodes = data;
                renderTable(allCodes);
            }
        }

        function renderTable(codes) {
            const tbody = document.getElementById("codesTableBody");
            tbody.innerHTML = "";
            if (codes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">لا توجد أكواد حالياً</td></tr>';
                return;
            }

            codes.forEach(c => {
                const tr = document.createElement("tr");
                const createdDate = new Date(c.created_at).toLocaleDateString("ar-EG");
                const activatedDate = c.activated_at ? new Date(c.activated_at).toLocaleDateString("ar-EG") : "لم يفعل بعد";
                const expiresDate = c.expires_at ? new Date(c.expires_at).toLocaleDateString("ar-EG") : "يبدأ بعد التفعيل";

                tr.innerHTML = `
                    <td><strong>${c.code}</strong></td>
                    <td>${c.duration_days} يوم</td>
                    <td>${c.used_devices} / ${c.max_devices}</td>
                    <td><span class="badge badge-${c.status}">${getStatusText(c.status)}</span></td>
                    <td>${createdDate}</td>
                    <td>${activatedDate}</td>
                    <td>${expiresDate}</td>
                    <td>
                        <button class="action-btn btn-toggle" onclick="toggleStatus('${c.id}', '${c.status}')"><i class="fa-solid ${c.status === 'active' ? 'fa-ban' : 'fa-check-circle'}"></i></button>
                        <button class="action-btn btn-delete" onclick="deleteCode('${c.id}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getStatusText(status) {
            if (status === 'active') return 'مفعل';
            if (status === 'disabled') return 'معطل';
            if (status === 'expired') return 'منتهي';
            return status;
        }

        async function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'active' ? 'disabled' : 'active';
            const { error } = await supabaseClient.from('activation_codes').update({ status: newStatus }).eq('id', id);
            if (!error) loadCodes();
        }

        async function deleteCode(id) {
            if (!confirm("هل أنت متأكد من الحذف؟")) return;
            const { error } = await supabaseClient.from('activation_codes').delete().eq('id', id);
            if (!error) loadCodes();
        }

        function filterCodes() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const statusFilter = document.getElementById("statusFilter").value;
            const filtered = allCodes.filter(c => {
                const matchesSearch = c.code.toLowerCase().includes(query);
                const matchesStatus = statusFilter === 'all' || c.status === statusFilter;
                return matchesSearch && matchesStatus;
            });
            renderTable(filtered);
        }

        function exportData(format) {
            if (allCodes.length === 0) return alert("لا توجد بيانات للتصدير");
            let dataStr = "", fileName = `codes_export_${new Date().toISOString().slice(0,10)}`;
            if (format === 'json') {
                dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allCodes, null, 2));
                fileName += ".json";
            } else {
                let csv = "ID,Code,DurationDays,MaxDevices,UsedDevices,Status,CreatedAt\n";
                allCodes.forEach(c => { csv += `"${c.id}","${c.code}",${c.duration_days},${c.max_devices},${c.used_devices},"${c.status}","${c.created_at}"\n`; });
                dataStr = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
                fileName += ".csv";
            }
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
